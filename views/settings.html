<!doctype html>
<html>


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bami tracker by Nouk</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">WhosTurn</a>

            <!-- Hamburger button (shows on small screens) -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links (collapse into hamburger on small screens) -->
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/bitterballen">Climbing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stats">Stats</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/settings">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/info">Info</a>
                    </li>
                </ul>
                <span id="userNav" class="navbar-text ms-3 d-none">
                    <span id="navGroupName"></span>
                    <button id="logoutBtn" class="btn btn-sm btn-outline-light ms-2">Logout</button>
                </span>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1>Settings</h1>

        <!-- Add Member -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Add Member</h5>
                <div class="mb-2">
                    <input type="text" class="form-control" id="newMemberName" placeholder="Name">
                </div>
                <div class="d-flex gap-3 mb-2 flex-wrap">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="newCarpool">
                        <label class="form-check-label" for="newCarpool">Carpool</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="newBeer">
                        <label class="form-check-label" for="newBeer">Beer</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="newBitterballen">
                        <label class="form-check-label" for="newBitterballen">Climbing</label>
                    </div>
                </div>
                <button class="btn btn-success w-100" id="addMemberBtn">
                    <i class="bi bi-plus-circle me-1"></i>Add
                </button>
                <div id="addMessage" class="mt-2"></div>
            </div>
        </div>

        <!-- Member List -->
        <div class="mt-4">
            <h5>Members</h5>
            <div id="memberList"></div>
        </div>
    </main>

    <!--Footer-->
    <footer>
        <div class="container">
            <p>Beer poured by
                <a href="https://yosemite.nl/" target="_blank" rel="noopener">
                    <img src="/images/YosemiteLogo.png" alt="Yosemite" style="height: 2em; vertical-align: middle;">
                </a>
            </p>
            <p>Check out my other work.</p>
            <a href="https://www.linkedin.com/in/nouk-g-1718b9170/" target="_blank" rel="noopener"
               class=" me-3 fs-5">
                <i class="bi bi-linkedin"></i>
            </a>
            <a href="https://cv.noukgeelen.nl/pages/portfolio.html" target="_blank" rel="noopener"
               class="fs-5">
                <i class="bi bi-person-circle"></i>
            </a>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Settings JavaScript -->
    <script src="/js/settings.js"></script>

    <!-- Navbar (auth) -->
    <script src="/js/navbar.js"></script>

    <!-- Live reload -->
    <script src="http://localhost:35729/livereload.js"></script>

</body>
</html>
